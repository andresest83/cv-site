singles:
  - company: Rackspace Technology
    date: 'May 2025 - Present'
    title: Senior AWS DevOps Engineer
    location: Berlin, Germany
    overview: >-
      Delivery engineering for enterprise AWS estates in automotive, and in
      logistics and shipping under KRITIS regulation.
    technologies:
      - Terraform
      - Terragrunt
      - Amazon Bedrock
      - Apache Iceberg
      - AWS Glue
      - PySpark
      - Amazon Athena
      - AWS Lake Formation
      - Transit Gateway
      - GitLab CI/CD
      - GitHub Actions
      - Grafana
    results:
      - >-
        Run platform engineering across six AWS projects for an automotive
        group, entirely in Terraform: migrated every repository from GitLab to
        GitHub, built a single Grafana dashboard aggregating metrics from all
        six, and delivered security-posture work with the client security team
        including an IAM pipeline.
      - >-
        Built an end-to-end GenAI data platform for a premium automotive
        manufacturer: a Glue and PySpark ETL pipeline consolidating
        production-line data into an Apache Iceberg lakehouse, fronted by an
        agentic assistant on Amazon Bedrock querying Athena through a Converse
        API tool-use loop. Production-line staff who write no code now ask in
        natural language instead of queueing behind the one engineer who could
        query the underlying Oracle database. The assistant returns the SQL it
        generated, so a harder question can be passed straight to an engineer to
        extend. Engagement delivered in German.
      - >-
        Migrated 42 of a logistics and shipping enterprise's most critical AWS
        accounts to a standardized Terragrunt and GitLab CI/CD model in a
        KRITIS-regulated environment, including the Shared Transit Gateway that
        all ~350 accounts in the estate route through. Assigned as the team's
        most experienced engineer, after earlier work on that account alongside
        the team lead, and sequenced with the account-owning teams across the
        estate.
      - >-
        Recovered a Transit Gateway Resource Access Manager share in one hour
        using terraform import and a targeted apply, reconciling state without
        rebuilding shared network infrastructure.
      - >-
        Ran DevOps for a commercial-vehicle manufacturer's hub-and-spoke data
        lake and RAG platform: AWS CDK and GitLab CI/CD, Lake Formation
        cross-account data sharing, and clearing every AWS Security Hub finding
        on the hosting account, the gate a vLLM-based Retrieval-Augmented
        Generation (RAG) workload had to pass to reach production.
      - >-
        Delivered centralized Grafana observability across five production
        workloads in an automotive Run Office, including a Bedrock AI toolbox,
        and automated AWS Budgets provisioning in Lambda on two separate
        engagements, replacing per-project manual configuration.

  - company: MHP - A Porsche Company
    date: 'Nov 2024 - May 2025'
    title: Senior AWS Consultant
    location: Berlin, Germany
    technologies:
      - Terraform
      - ECS Fargate
      - Trino / Starburst
      - Flask
      - Kubernetes
      - ArgoCD
      - GitHub Actions
    results:
      - >-
        Designed and deployed secure AWS middleware for querying Starburst data:
        a Flask API handling OAuth2 authentication over Trino with mTLS and IAM,
        running on ECS Fargate behind an Application Load Balancer, with ECR, VPC
        endpoints and KMS-encrypted Secrets Manager, all provisioned in
        Terraform. Delivered query-indexing recommendations and load testing for
        large datasets.
      - >-
        Migrated a manually managed Kubernetes cluster to Terraform and
        implemented GitOps CI/CD with GitHub Actions and ArgoCD.

  - company: AWS Professional Services
    date: 'Nov 2021 - Jul 2024'
    title: DevOps Consultant
    location: Berlin, Germany
    overview: >-
      Delivery across regulated industry for named enterprise clients, two of
      whose platforms AWS later published as customer case studies.
    technologies:
      - AWS CDK
      - Python
      - Terraform
      - Amazon SageMaker
      - Redshift Serverless
      - MLflow
      - AWS Glue
      - PySpark
      - Apache Iceberg
      - EKS on Fargate
      - Helm
      - TFSec
    links:
      - label: 'AWS case study: Boehringer Ingelheim, Dataland'
        url: https://aws.amazon.com/solutions/case-studies/boehringer-ingelheim-case-study/
      - label: 'AWS case study: Covestro data governance with Amazon DataZone'
        url: https://aws.amazon.com/blogs/big-data/scaling-data-governance-with-amazon-datazone-covestro-success-story/
    results:
      - >-
        Boehringer Ingelheim, Dataland (approx. one year). GxP-regulated
        enterprise data platform on AWS, later published by AWS as a customer
        case study. Deployed AWS Professional Services' data.all data
        marketplace in AWS CDK and Python: inter-region VPC peering, Amazon
        SageMaker, Redshift Serverless and MLflow.
      - >-
        Led the AWS Professional Services delivery team for the final three
        months of that engagement: client sprint reviews, task prioritisation
        across the AWS team, and the technical bridge between AWS and the client
        on the project's progress. On site in Barcelona for requirements
        gathering and planning with the client's programme manager, and hands-on
        troubleshooting of a client engineer's access to the platform.
      - >-
        Covestro Deutschland AG, the German polymers manufacturer. Data
        Architect on the Serverless Data Lake Framework (SDLF), migrating
        Tableau prep-flows to AWS Glue (PySpark). AWS later published the
        DataZone data mesh built on that foundation as a customer case study.
        Also built a GitLab pipeline for an ML-powered document and
        order-processing workload.
      - >-
        acierto.com (Spain). Built a Terraform observability stack for EKS on
        Fargate: ADOT, kube metrics and events, X-Ray, and CloudWatch dashboards
        generated in Python. Presented the project outcomes on site in Barcelona
        to the client's whole company.
      - >-
        Built Terraform pipelines for EKS with security scanning (TFSec) in
        CodeBuild for a bank in Abu Dhabi, and automated cluster tooling
        installation with Helm charts.
      - >-
        Built multi-account VPC and Transit Gateway automation with advanced AWS
        CDK configurations for a telecommunications client in Israel.

  - company: Deutsche Bahn
    date: 'Nov 2020 - Oct 2021'
    title: AWS Cloud Administrator
    location: Berlin, Germany
    technologies:
      - AWS EC2
      - Auto Scaling
      - RDS
      - CloudWatch
      - Packer
      - GitLab CI/CD
      - Windows Server
    results:
      - >-
        Implemented an automated AMI customization pipeline for Windows Server
        with Packer and GitLab, after solving the Packer-to-Windows-EC2
        connection problem that had blocked the team.
      - >-
        Managed the AWS backend (EC2, Auto Scaling, ELB, RDS, CloudWatch) of the
        point-of-sale system running on mobile devices across the entire ICE
        high-speed train fleet.
      - >-
        Orchestrated release roll-outs across test and production environments
        via GitLab. Engagement delivered in German.

