paragraphs:
  - >-
    Cloud platform engineer, {{yearsOfExperience}} years from bare-metal
    datacenters to production AI infrastructure. Worked for startups, SMEs and
    large corporations, on projects in seven countries across Latin America,
    Europe, the Middle East and the United States, in three different languages.
    Former AWS Professional Services, delivering for regulated industry:
    automotive, logistics, pharmaceutical, chemical and rail. Currently running
    platform engineering across six AWS projects, entirely in Terraform.
