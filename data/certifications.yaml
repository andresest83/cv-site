# Rendered as a flat grid in file order, two per row on desktop. The `group` key
# is required by the schema but never displayed, so the list is ordered by
# relevance to the roles being targeted, not by vendor.
- group: Certifications
  cssClass: cert-aws
  certs:
    - title: 'AWS Certified Generative AI Developer - Professional'
      image: /images/certs/aws-genai-developer-professional.webp
      alt: AWS Certified Generative AI Developer, Professional
      issued: 'Jun 2026'

    - title: 'AWS Certified Machine Learning Engineer - Associate'
      image: /images/certs/aws-ml-engineer-associate.webp
      alt: AWS Certified Machine Learning Engineer, Associate
      issued: 'Mar 2026'

    - title: 'NVIDIA Certified Associate: AI Infrastructure and Operations'
      image: /images/certs/nvidia-ai-infrastructure-operations-associate.webp
      alt: NVIDIA Certified Associate, AI Infrastructure and Operations
      issued: 'Sep 2026'

    - title: 'AWS Certified Developer - Associate'
      image: /images/certs/aws-developer-associate.webp
      alt: AWS Certified Developer, Associate
      issued: 'Jun 2026'

    # Retired by AWS, so there is no renewal path and no current holder anywhere.
    # Earned in 2023 and listed on its own terms.
    - title: 'AWS Certified Data Analytics - Specialty'
      image: /images/certs/aws-data-analytics-specialty.webp
      alt: AWS Certified Data Analytics, Specialty
      issued: '2023'

    - title: 'HashiCorp Certified: Terraform Associate (003)'
      image: /images/certs/terraform_associate.webp
      alt: HashiCorp Certified Terraform Associate
      issued: 'Oct 2024'
